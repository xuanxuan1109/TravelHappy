<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>创建新旅行 · TravelHappy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { 
              sans: ['-apple-system', 'SF Pro Display', 'SF Pro Text', 'system-ui', 'Inter', 'ui-sans-serif']
            },
            colors: {
              primary: {
                50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
                400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
                800: '#075985', 900: '#0c4a6e'
              },
              accent: {
                50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc',
                400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf',
                800: '#86198f', 900: '#701a75'
              },
              mood: {
                happy: '#f59e0b', calm: '#10b981', excited: '#ef4444', 
                love: '#ec4899', wonder: '#8b5cf6', peace: '#06b6d4',
                neutral: '#6b7280'
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.4s ease-out',
              'bounce-soft': 'bounceSoft 0.6s ease-out',
              'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
              'float': 'float 3s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
              'wiggle': 'wiggle 1s ease-in-out infinite'
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              bounceSoft: { '0%, 20%, 53%, 80%, 100%': { transform: 'translate3d(0,0,0)' }, '40%, 43%': { transform: 'translate3d(0, -8px, 0)' }, '70%': { transform: 'translate3d(0, -4px, 0)' }, '90%': { transform: 'translate3d(0, -2px, 0)' } },
              pulseSoft: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.8' } },
              float: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-10px)' } },
              glow: { '0%': { boxShadow: '0 0 5px rgba(14, 165, 233, 0.5)' }, '100%': { boxShadow: '0 0 20px rgba(14, 165, 233, 0.8)' } },
              wiggle: { '0%, 100%': { transform: 'rotate(-3deg)' }, '50%': { transform: 'rotate(3deg)' } }
            }
          }
        }
      }
    </script>
    <style>
      :root { 
        color-scheme: light; 
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
      }
      * { -webkit-tap-highlight-color: transparent; }
      html, body { 
        height: 100%; 
        background: linear-gradient(135deg, #0ea5e9 0%, #d946ef 100%);
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .touch-feedback { transition: transform 0.1s ease-out; }
      .touch-feedback:active { transform: scale(0.98); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body class="min-h-screen text-slate-900 antialiased">
    <!-- Safe area container -->
    <div class="min-h-screen" style="padding-top: var(--safe-area-inset-top); padding-bottom: var(--safe-area-inset-bottom);">
      <!-- Main app container -->
      <div class="mx-auto max-w-sm min-h-screen bg-white shadow-2xl">
        
        <!-- Status bar -->
        <div class="h-6 bg-white flex items-center justify-between px-6 text-xs font-medium text-slate-600">
          <span>9:41</span>
          <div class="flex items-center gap-1">
            <div class="w-4 h-2 bg-slate-900 rounded-sm"></div>
            <div class="w-6 h-3 border border-slate-900 rounded-sm">
              <div class="w-4 h-2 bg-slate-900 rounded-sm m-0.5"></div>
            </div>
          </div>
        </div>

        <!-- Header -->
        <header class="px-6 pt-4 pb-6 bg-white/80 backdrop-blur-sm">
          <div class="flex items-center gap-3 mb-6">
            <button onclick="goBack()" class="w-10 h-10 rounded-2xl bg-slate-100 flex items-center justify-center touch-feedback">
              <svg viewBox="0 0 24 24" class="w-5 h-5 text-slate-600">
                <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
              </svg>
            </button>
            <div>
              <h1 class="text-lg font-semibold text-slate-900">创建新旅行</h1>
              <p class="text-sm text-slate-500">开始记录你的美好旅程</p>
            </div>
          </div>
        </header>

        <!-- Form -->
        <div class="px-6 pb-6">
          <form id="new-trip-form" class="space-y-6">
            <!-- Trip Name -->
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">旅行名称</label>
              <input type="text" id="trip-name" required class="w-full px-4 py-3 bg-slate-50 rounded-xl border-0 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all" placeholder="例如：京都赏樱之旅" />
            </div>

            <!-- Destination -->
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">目的地</label>
              <input type="text" id="destination" required class="w-full px-4 py-3 bg-slate-50 rounded-xl border-0 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all" placeholder="例如：京都, 日本" />
            </div>

            <!-- Date Range -->
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">开始日期</label>
                <input type="date" id="start-date" required class="w-full px-4 py-3 bg-slate-50 rounded-xl border-0 text-slate-900 focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all" />
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">结束日期</label>
                <input type="date" id="end-date" required class="w-full px-4 py-3 bg-slate-50 rounded-xl border-0 text-slate-900 focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all" />
              </div>
            </div>

            <!-- Budget -->
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">预算</label>
              <div class="relative">
                <input type="number" id="budget" required class="w-full px-4 py-3 bg-slate-50 rounded-xl border-0 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all" placeholder="3000" />
                <div class="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-500">CNY</div>
              </div>
            </div>


            <!-- Notes -->
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2">备注</label>
              <textarea id="notes" rows="3" class="w-full px-4 py-3 bg-slate-50 rounded-xl border-0 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-primary-500 focus:bg-white transition-all" placeholder="记录一些旅行计划或期待..."></textarea>
            </div>

            <!-- Submit Button -->
            <div class="pt-4">
              <button type="submit" class="w-full bg-gradient-to-r from-primary-500 to-accent-500 text-white py-4 rounded-2xl font-medium touch-feedback shadow-lg hover:shadow-xl transition-all duration-300">
                创建旅行
              </button>
            </div>
          </form>
        </div>

        <!-- Add bottom padding -->
        <div class="h-6"></div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script>
      // 设置默认日期
      document.addEventListener('DOMContentLoaded', function() {
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        
        document.getElementById('start-date').value = today.toISOString().split('T')[0];
        document.getElementById('end-date').value = tomorrow.toISOString().split('T')[0];
      });


      // 表单提交
      document.getElementById('new-trip-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = {
          name: document.getElementById('trip-name').value,
          destination: document.getElementById('destination').value,
          startDate: document.getElementById('start-date').value,
          endDate: document.getElementById('end-date').value,
          budget: parseFloat(document.getElementById('budget').value),
          currency: 'CNY', // 默认人民币
          type: 'leisure', // 默认休闲游
          notes: document.getElementById('notes').value
        };

        // 验证表单
        if (!formData.name || !formData.destination || !formData.startDate || !formData.endDate || !formData.budget) {
          showToast('请填写所有必填字段', 'error');
          return;
        }

        if (new Date(formData.startDate) >= new Date(formData.endDate)) {
          showToast('结束日期必须晚于开始日期', 'error');
          return;
        }

        // 创建旅行
        try {
          // 生成随机UI色彩
          const randomColors = generateRandomColors();
          formData.uiColors = randomColors;
          
          const newTrip = window.travelData.createTrip(formData);
          showToast('旅行创建成功！', 'success');
          
          // 延迟跳转
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } catch (error) {
          showToast('创建失败，请重试', 'error');
          console.error('创建旅行失败:', error);
        }
      });

      // 生成随机UI色彩
      function generateRandomColors() {
        const colorPalettes = [
          {
            primary: '#0ea5e9', // 蓝色
            accent: '#d946ef',  // 紫色
            name: '海洋蓝'
          },
          {
            primary: '#f59e0b', // 橙色
            accent: '#ef4444',  // 红色
            name: '夕阳橙'
          },
          {
            primary: '#10b981', // 绿色
            accent: '#06b6d4',  // 青色
            name: '森林绿'
          },
          {
            primary: '#8b5cf6', // 紫色
            accent: '#ec4899',  // 粉色
            name: '梦幻紫'
          },
          {
            primary: '#ef4444', // 红色
            accent: '#f59e0b',  // 橙色
            name: '热情红'
          },
          {
            primary: '#06b6d4', // 青色
            accent: '#10b981',  // 绿色
            name: '清新青'
          }
        ];
        
        const randomIndex = Math.floor(Math.random() * colorPalettes.length);
        return colorPalettes[randomIndex];
      }

      // 返回上一页
      function goBack() {
        window.history.back();
      }

      // 显示提示消息
      function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `fixed top-20 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl text-white font-medium z-50 animate-slide-up ${
          type === 'success' ? 'bg-green-500' : 
          type === 'error' ? 'bg-red-500' : 'bg-blue-500'
        }`;
        toast.textContent = message;
        
        document.body.appendChild(toast);
        
        setTimeout(() => {
          toast.remove();
        }, 3000);
      }
    </script>
  </body>
</html>
